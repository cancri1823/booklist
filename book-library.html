<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的書庫</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1c1f2e;--ink2:#3a3f55;--ink3:#6b7180;
  --paper:#faf8f4;--paper2:#f2efe8;--paper3:#e8e3d8;
  --indigo:#2d3a8c;--indigo2:#3d4fa8;--indigo-pale:#eef0fb;
  --amber:#b07d2e;--amber-pale:#fdf6e8;
  --green:#1f7a4a;--green-pale:#e8f7ef;
  --red:#a52020;--red-pale:#fdecea;
  --blue-pale:#e8f0fe;--blue:#1a56a8;
  --border:#ddd8cc;--border2:#c8c2b4;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --shadow:0 2px 8px rgba(28,31,46,0.08);
  --shadow-lg:0 4px 20px rgba(28,31,46,0.13);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:14px}

/* Top bar */
#topbar{background:var(--ink);padding:0 20px;height:54px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex-shrink:0}
.logo-icon{width:30px;height:30px;background:var(--amber);border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-icon i{color:var(--ink);font-size:16px}
.logo-text{font-size:16px;font-weight:600;letter-spacing:-0.3px}
.topbar-search{flex:1;max-width:380px;position:relative}
.topbar-search input{width:100%;padding:7px 12px 7px 34px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:var(--radius);color:#fff;font-size:13px;outline:none}
.topbar-search input::placeholder{color:rgba(255,255,255,0.4)}
.topbar-search input:focus{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3)}
.topbar-search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.4);font-size:15px}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border);background:#fff;color:var(--ink);font-size:12px;cursor:pointer;font-weight:500;transition:all 0.15s;white-space:nowrap}
.btn:hover{background:var(--paper2);border-color:var(--border2)}
.btn-primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn-primary:hover{background:var(--indigo2)}
.btn-amber{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn-amber:hover{opacity:0.9}
.btn-ghost{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,0.18)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--red-pale);color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-icon{padding:7px;border-radius:var(--radius);border:1px solid var(--border);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all 0.15s}
.btn-icon:hover{background:var(--paper2)}
.btn-icon.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}

/* Toolbar */
#toolbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;font-size:12px;color:var(--ink);cursor:pointer;outline:none}
.filter-select:focus{border-color:var(--indigo)}
.toolbar-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.count-badge{font-size:12px;color:var(--ink3);padding:0 4px}

/* Stats bar */
#statsbar{background:var(--indigo-pale);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;gap:20px;flex-wrap:wrap}
.stat-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.stat-item strong{color:var(--indigo);font-weight:600}
.stat-dot{width:8px;height:8px;border-radius:50%}

/* Grid */
#grid-view{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
#list-view{display:none;padding:0 20px 20px}

/* Book card */
.book-card{cursor:pointer;transition:transform 0.15s,box-shadow 0.15s}
.book-card:hover{transform:translateY(-3px)}
.book-card:hover .book-cover-wrap{box-shadow:var(--shadow-lg)}
.book-cover-wrap{border-radius:var(--radius);overflow:hidden;aspect-ratio:2/3;position:relative;box-shadow:var(--shadow)}
.book-cover-img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px}
.book-cover-placeholder .spine-title{font-size:11px;font-weight:600;text-align:center;line-height:1.3;word-break:break-all}
.book-cover-placeholder .spine-author{font-size:10px;opacity:0.7;text-align:center}
.book-status-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.8)}
.book-loan-badge{position:absolute;top:6px;left:6px;background:#f59e0b;color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px}
.book-meta{margin-top:7px;padding:0 2px}
.book-title{font-size:12px;font-weight:600;line-height:1.3;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book-author{font-size:11px;color:var(--ink3);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.book-cat{font-size:10px;color:var(--indigo);margin-top:3px;font-weight:500}

/* List view */
.list-table{width:100%;border-collapse:collapse;margin-top:12px}
.list-table th{text-align:left;padding:8px 12px;background:var(--paper2);color:var(--ink3);font-weight:500;font-size:12px;border-bottom:1px solid var(--border);position:sticky;top:108px;z-index:10}
.list-table td{padding:8px 12px;border-bottom:1px solid var(--paper3);font-size:13px;vertical-align:middle}
.list-table tr:hover td{background:var(--indigo-pale);cursor:pointer}
.list-cover-thumb{width:32px;height:46px;border-radius:3px;object-fit:cover;box-shadow:0 1px 4px rgba(0,0,0,0.12)}
.list-cover-ph{width:32px;height:46px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(255,255,255,0.9)}

/* Status badges */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.status-unread{background:var(--paper2);color:var(--ink3)}
.status-reading{background:var(--amber-pale);color:var(--amber)}
.status-done{background:var(--green-pale);color:var(--green)}
.lang-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;background:var(--indigo-pale);color:var(--indigo)}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(28,31,46,0.5);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:var(--radius-xl);width:100%;max-width:720px;margin:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:18px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:var(--radius-xl) var(--radius-xl) 0 0;z-index:5}
.modal-title{font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#fff;border-radius:0 0 var(--radius-xl) var(--radius-xl)}

/* Form */
.form-section{margin-bottom:22px}
.form-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink3);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--paper3)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-grid-3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;font-weight:500;color:var(--ink2)}
.form-group label span.req{color:var(--red);margin-left:2px}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--ink);background:#fff;font-family:inherit;transition:border-color 0.15s;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(45,58,140,0.08)}
.form-group textarea{resize:vertical;min-height:80px}
.conditional{display:none}
.conditional.show{display:flex;flex-direction:column;gap:4px}

/* Cover upload */
.cover-upload-area{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;transition:border-color 0.15s;background:var(--paper)}
.cover-upload-area:hover{border-color:var(--indigo)}
.cover-preview-wrap{position:relative;display:inline-block}
.cover-preview{width:100px;height:150px;object-fit:cover;border-radius:var(--radius);box-shadow:var(--shadow)}
.cover-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}

/* Detail modal */
.detail-cover{width:120px;height:180px;object-fit:cover;border-radius:var(--radius);box-shadow:var(--shadow-lg);flex-shrink:0}
.detail-cover-ph{width:120px;height:180px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-lg)}
.detail-info{flex:1;min-width:0}
.detail-title{font-size:20px;font-weight:700;line-height:1.3;color:var(--ink);margin-bottom:4px}
.detail-author{font-size:14px;color:var(--ink3);margin-bottom:10px}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.detail-field{background:var(--paper);border-radius:var(--radius);padding:8px 10px}
.detail-field-label{font-size:10px;color:var(--ink3);font-weight:500;margin-bottom:2px}
.detail-field-value{font-size:13px;font-weight:500;color:var(--ink)}
.detail-summary{background:var(--paper);border-radius:var(--radius);padding:12px;font-size:13px;line-height:1.7;color:var(--ink2);margin-top:12px}

/* Toast */
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:280px}
#toast.show{opacity:1}

/* Google Drive sync bar */
#syncbar{background:#fff;border-bottom:1px solid var(--border);padding:6px 20px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3);min-height:34px}
#syncbar.syncing{background:#fffbeb}
#syncbar.error{background:#fff1f0}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-dot.connected{background:#16a34a}
.sync-dot.disconnected{background:#9ca3af}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
.sync-dot.error{background:#dc2626}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
.sync-actions{margin-left:auto;display:flex;gap:6px}

/* Empty */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-state i{font-size:48px;opacity:0.3;display:block;margin-bottom:12px}
.empty-state p{font-size:14px}

@media(max-width:640px){
  #grid-view{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:14px}
  .modal-body{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .detail-cover,.detail-cover-ph{width:90px;height:135px}
  .detail-title{font-size:16px}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-books"></i></div>
    <span class="logo-text">我的書庫</span>
  </div>
  <div class="topbar-search">
    <i class="ti ti-search"></i>
    <input type="text" id="search-input" placeholder="搜尋書名、作者、ISBN…" oninput="renderBooks()">
  </div>
  <div class="topbar-right">
    <button class="btn btn-ghost btn-sm" id="gdrive-btn" onclick="handleGoogleAuth()"><i class="ti ti-brand-google-drive"></i> <span id="gdrive-btn-text">連結 Google Drive</span></button>
    <button class="btn btn-ghost btn-sm" onclick="exportData()"><i class="ti ti-download"></i> 匯出</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()"><i class="ti ti-upload"></i> 匯入</button>
    <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none" onchange="importData(event)">
    <button class="btn btn-amber" onclick="openAddModal()"><i class="ti ti-plus"></i> 新增書籍</button>
  </div>
</div>

<div id="syncbar">
  <div class="sync-dot disconnected" id="sync-dot"></div>
  <span id="sync-status">尚未連結 Google Drive，資料暫存於此裝置</span>
  <div class="sync-actions">
    <button class="btn btn-sm" id="sync-now-btn" style="display:none" onclick="syncNow()"><i class="ti ti-refresh"></i> 立即同步</button>
    <button class="btn btn-sm btn-danger" id="signout-btn" style="display:none" onclick="signOut()"><i class="ti ti-logout"></i> 登出</button>
  </div>
</div>

<div id="toolbar">
  <select class="filter-select" id="f-cat" onchange="renderBooks()"><option value="">所有分類</option></select>
  <select class="filter-select" id="f-subcat" onchange="renderBooks()"><option value="">所有子分類</option></select>
  <select class="filter-select" id="f-lang" onchange="renderBooks()">
    <option value="">所有語言</option>
    <option value="繁體中文">繁體中文</option>
    <option value="英文">英文</option>
    <option value="日文">日文</option>
    <option value="簡體中文">簡體中文</option>
  </select>
  <select class="filter-select" id="f-status" onchange="renderBooks()">
    <option value="">所有狀態</option>
    <option value="unread">尚未閱讀</option>
    <option value="reading">閱讀中</option>
    <option value="done">已閱畢</option>
  </select>
  <select class="filter-select" id="f-loan" onchange="renderBooks()">
    <option value="">借閱狀況</option>
    <option value="loaned">外借中</option>
    <option value="in">在架上</option>
  </select>
  <div class="toolbar-right">
    <span class="count-badge" id="book-count"></span>
    <button class="btn-icon active" id="view-grid" onclick="setView('grid')" title="書格視圖"><i class="ti ti-layout-grid"></i></button>
    <button class="btn-icon" id="view-list" onclick="setView('list')" title="清單視圖"><i class="ti ti-list"></i></button>
  </div>
</div>

<div id="statsbar"></div>

<div id="grid-view"></div>
<div id="list-view">
  <table class="list-table">
    <thead><tr>
      <th style="width:50px">封面</th>
      <th>書名</th><th>作者</th><th>分類</th>
      <th>語言</th><th>狀態</th><th>購買日期</th><th>外借</th>
    </tr></thead>
    <tbody id="list-tbody"></tbody>
  </table>
</div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="book-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title"><i class="ti ti-book"></i> <span id="modal-title-text">新增書籍</span></span>
      <button class="btn btn-sm" onclick="closeModal('book-modal')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">

      <!-- Cover -->
      <div class="form-section">
        <div class="form-section-title">封面</div>
        <div style="display:flex;gap:16px;align-items:flex-start">
          <div id="cover-preview-area" style="flex-shrink:0"></div>
          <div id="cover-upload-area" class="cover-upload-area" style="flex:1" onclick="document.getElementById('cover-input').click()">
            <i class="ti ti-photo-up" style="font-size:28px;color:var(--ink3);display:block;margin-bottom:8px"></i>
            <p style="font-size:12px;color:var(--ink3)">點擊上傳封面圖片</p>
            <p style="font-size:11px;color:var(--ink3);margin-top:4px">JPG / PNG，建議比例 2:3</p>
          </div>
          <input type="file" id="cover-input" accept="image/*" style="display:none" onchange="handleCoverUpload(event)">
        </div>
      </div>

      <!-- Basic Info -->
      <div class="form-section">
        <div class="form-section-title">基本資訊</div>
        <div class="form-grid">
          <div class="form-group full">
            <label>書名 <span class="req">*</span></label>
            <input type="text" id="f-title" placeholder="請輸入書名">
          </div>
          <div class="form-group">
            <label>分類</label>
            <input type="text" id="f-category" list="cat-list" placeholder="文學、歷史、科技…">
            <datalist id="cat-list"></datalist>
          </div>
          <div class="form-group">
            <label>子分類</label>
            <input type="text" id="f-subcategory" list="subcat-list" placeholder="小說、傳記…">
            <datalist id="subcat-list"></datalist>
          </div>
          <div class="form-group full">
            <label>
              <input type="checkbox" id="f-series-check" onchange="toggleSeries()" style="margin-right:6px">
              屬於系列作品
            </label>
            <div id="series-fields" class="conditional" style="flex-direction:row;gap:10px;margin-top:6px">
              <input type="text" id="f-series-name" placeholder="系列名稱" style="flex:2">
              <input type="text" id="f-series-vol" placeholder="集數 / 副標題" style="flex:1">
            </div>
          </div>
          <div class="form-group">
            <label>作者</label>
            <input type="text" id="f-author" placeholder="作者姓名">
          </div>
          <div class="form-group">
            <label>語言 <span class="req">*</span></label>
            <select id="f-lang-select" onchange="toggleTranslator()">
              <option value="繁體中文">繁體中文</option>
              <option value="英文">英文</option>
              <option value="日文">日文</option>
              <option value="簡體中文">簡體中文</option>
              <option value="other">其他語言</option>
            </select>
          </div>
          <div class="form-group" id="lang-other-wrap" style="display:none">
            <label>指定語言</label>
            <input type="text" id="f-lang-other" placeholder="請輸入語言名稱">
          </div>
          <div class="form-group" id="translator-wrap" style="display:none">
            <label>譯者</label>
            <input type="text" id="f-translator" placeholder="譯者姓名">
          </div>
        </div>
      </div>

      <!-- Publication -->
      <div class="form-section">
        <div class="form-section-title">出版資訊</div>
        <div class="form-grid form-grid-3">
          <div class="form-group">
            <label>出版日期</label>
            <input type="date" id="f-pub-date">
          </div>
          <div class="form-group">
            <label>出版社</label>
            <input type="text" id="f-publisher" placeholder="出版社名稱">
          </div>
          <div class="form-group">
            <label>ISBN</label>
            <input type="text" id="f-isbn" placeholder="ISBN-13">
          </div>
          <div class="form-group">
            <label>版次</label>
            <input type="text" id="f-edition" placeholder="初版、第二版…">
          </div>
        </div>
        <div class="form-group" style="margin-top:10px">
          <label>摘要 / 備註</label>
          <textarea id="f-summary" placeholder="書籍簡介、個人筆記…"></textarea>
        </div>
      </div>

      <!-- Purchase -->
      <div class="form-section">
        <div class="form-section-title">購買資訊</div>
        <div class="form-grid form-grid-3">
          <div class="form-group">
            <label>購買日期</label>
            <input type="date" id="f-buy-date">
          </div>
          <div class="form-group">
            <label>購買價格</label>
            <input type="number" id="f-price" placeholder="0" step="1">
          </div>
          <div class="form-group">
            <label>購買商店</label>
            <input type="text" id="f-store" placeholder="博客來、誠品…">
          </div>
        </div>
      </div>

      <!-- Reading -->
      <div class="form-section">
        <div class="form-section-title">閱讀狀況</div>
        <div class="form-grid">
          <div class="form-group">
            <label>閱讀狀態</label>
            <select id="f-read-status" onchange="toggleReadingPage()">
              <option value="unread">尚未閱讀</option>
              <option value="reading">閱讀中</option>
              <option value="done">已閱畢</option>
            </select>
          </div>
          <div class="form-group conditional" id="reading-page-wrap">
            <label>目前閱讀頁數</label>
            <input type="number" id="f-reading-page" placeholder="頁數">
          </div>
        </div>
        <div class="form-group" style="margin-top:10px">
          <label>
            <input type="checkbox" id="f-loan-check" onchange="toggleLoan()" style="margin-right:6px">
            目前外借中
          </label>
          <div id="loan-fields" class="conditional" style="flex-direction:row;gap:10px;margin-top:8px">
            <div style="flex:1;display:flex;flex-direction:column;gap:4px">
              <label style="font-size:12px;color:var(--ink2)">借書人</label>
              <input type="text" id="f-loan-person" placeholder="姓名">
            </div>
            <div style="flex:1;display:flex;flex-direction:column;gap:4px">
              <label style="font-size:12px;color:var(--ink2)">借書日期</label>
              <input type="date" id="f-loan-date">
            </div>
          </div>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="delete-btn" style="display:none;margin-right:auto" onclick="deleteCurrentBook()"><i class="ti ti-trash"></i> 刪除</button>
      <button class="btn" onclick="closeModal('book-modal')">取消</button>
      <button class="btn btn-primary" onclick="saveBook()"><i class="ti ti-check"></i> 儲存</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="detail-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title"><i class="ti ti-book-2"></i> 書籍詳情</span>
      <button class="btn btn-sm" onclick="closeModal('detail-modal')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="detail-content"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('detail-modal')">關閉</button>
      <button class="btn btn-primary" id="detail-edit-btn"><i class="ti ti-pencil"></i> 編輯</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let db = [];
let currentEditId = null;
let currentCoverData = null;
let viewMode = 'grid';

const SPINE_COLORS = [
  ['#2d3a8c','#c5cdf5'],['#1f7a4a','#b8f0d0'],['#a52020','#f7c5c5'],
  ['#8b5e1a','#f5dda8'],['#4a2070','#d4b0f0'],['#1a5570','#a8d8f0'],
  ['#5a2d00','#f0c890'],['#1a4a2e','#90d0a8']
];
function spineColor(title){
  const i=(title.charCodeAt(0)||0)%SPINE_COLORS.length;
  return SPINE_COLORS[i];
}

function toast(msg,dur=2200){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return'—';return d.replace(/-/g,'/')}

// ---- UI toggles ----
function toggleSeries(){
  const on=document.getElementById('f-series-check').checked;
  document.getElementById('series-fields').classList.toggle('show',on);
}
function toggleTranslator(){
  const v=document.getElementById('f-lang-select').value;
  const notTW=v!=='繁體中文';
  const isOther=v==='other';
  document.getElementById('translator-wrap').style.display=notTW?'flex':'none';
  document.getElementById('lang-other-wrap').style.display=isOther?'flex':'none';
}
function toggleReadingPage(){
  const v=document.getElementById('f-read-status').value;
  document.getElementById('reading-page-wrap').classList.toggle('show',v==='reading');
}
function toggleLoan(){
  const on=document.getElementById('f-loan-check').checked;
  document.getElementById('loan-fields').classList.toggle('show',on);
}
function handleCoverUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{currentCoverData=ev.target.result;showCoverPreview(currentCoverData)};
  reader.readAsDataURL(file);
}
function showCoverPreview(src){
  const pa=document.getElementById('cover-preview-area');
  const ua=document.getElementById('cover-upload-area');
  if(src){
    ua.style.display='none';
    pa.innerHTML=`<div class="cover-preview-wrap"><img src="${src}" class="cover-preview"><button class="cover-remove" onclick="removeCover()"><i class="ti ti-x" style="font-size:10px"></i></button></div>`;
  } else {
    ua.style.display='';pa.innerHTML='';
  }
}
function removeCover(){currentCoverData=null;showCoverPreview(null)}

// ---- Datalists ----
function updateDataLists(){
  const cats=[...new Set(db.map(b=>b.category).filter(Boolean))];
  const subcats=[...new Set(db.map(b=>b.subcategory).filter(Boolean))];
  document.getElementById('cat-list').innerHTML=cats.map(c=>`<option value="${c}">`).join('');
  document.getElementById('subcat-list').innerHTML=subcats.map(c=>`<option value="${c}">`).join('');
}
function updateFilterOptions(){
  const cats=[...new Set(db.map(b=>b.category).filter(Boolean))].sort();
  const fc=document.getElementById('f-cat');
  const prev=fc.value;
  fc.innerHTML='<option value="">所有分類</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  fc.value=prev;

  const subcats=[...new Set(db.map(b=>b.subcategory).filter(Boolean))].sort();
  const fs=document.getElementById('f-subcat');
  const prev2=fs.value;
  fs.innerHTML='<option value="">所有子分類</option>'+subcats.map(c=>`<option value="${c}">${c}</option>`).join('');
  fs.value=prev2;
}

// ---- Open/close modals ----
function openAddModal(){
  currentEditId=null;currentCoverData=null;
  document.getElementById('modal-title-text').textContent='新增書籍';
  document.getElementById('delete-btn').style.display='none';
  resetForm();
  updateDataLists();
  document.getElementById('book-modal').classList.add('show');
}
function openEditModal(id){
  const b=db.find(x=>x.id===id);if(!b)return;
  currentEditId=id;currentCoverData=b.cover||null;
  document.getElementById('modal-title-text').textContent='編輯書籍';
  document.getElementById('delete-btn').style.display='';
  fillForm(b);
  updateDataLists();
  document.getElementById('book-modal').classList.add('show');
}
function closeModal(id){document.getElementById(id).classList.remove('show')}

function resetForm(){
  ['f-title','f-category','f-subcategory','f-series-name','f-series-vol',
   'f-author','f-translator','f-lang-other','f-pub-date','f-publisher',
   'f-isbn','f-edition','f-summary','f-buy-date','f-price','f-store',
   'f-reading-page','f-loan-person','f-loan-date'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value='';
  });
  document.getElementById('f-lang-select').value='繁體中文';
  document.getElementById('f-read-status').value='unread';
  document.getElementById('f-series-check').checked=false;
  document.getElementById('f-loan-check').checked=false;
  document.getElementById('series-fields').classList.remove('show');
  document.getElementById('reading-page-wrap').classList.remove('show');
  document.getElementById('loan-fields').classList.remove('show');
  document.getElementById('translator-wrap').style.display='none';
  document.getElementById('lang-other-wrap').style.display='none';
  showCoverPreview(null);
}

function fillForm(b){
  document.getElementById('f-title').value=b.title||'';
  document.getElementById('f-category').value=b.category||'';
  document.getElementById('f-subcategory').value=b.subcategory||'';
  document.getElementById('f-series-check').checked=!!b.series;
  document.getElementById('f-series-name').value=b.seriesName||'';
  document.getElementById('f-series-vol').value=b.seriesVol||'';
  document.getElementById('f-author').value=b.author||'';
  const langOpts=['繁體中文','英文','日文','簡體中文'];
  if(langOpts.includes(b.lang)){document.getElementById('f-lang-select').value=b.lang;}
  else{document.getElementById('f-lang-select').value='other';document.getElementById('f-lang-other').value=b.lang||'';}
  document.getElementById('f-translator').value=b.translator||'';
  document.getElementById('f-pub-date').value=b.pubDate||'';
  document.getElementById('f-publisher').value=b.publisher||'';
  document.getElementById('f-isbn').value=b.isbn||'';
  document.getElementById('f-edition').value=b.edition||'';
  document.getElementById('f-summary').value=b.summary||'';
  document.getElementById('f-buy-date').value=b.buyDate||'';
  document.getElementById('f-price').value=b.price||'';
  document.getElementById('f-store').value=b.store||'';
  document.getElementById('f-read-status').value=b.readStatus||'unread';
  document.getElementById('f-reading-page').value=b.readingPage||'';
  document.getElementById('f-loan-check').checked=!!b.loaned;
  document.getElementById('f-loan-person').value=b.loanPerson||'';
  document.getElementById('f-loan-date').value=b.loanDate||'';
  toggleSeries();toggleTranslator();toggleReadingPage();toggleLoan();
  showCoverPreview(b.cover||null);
}

function saveBook(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){toast('請填寫書名');return}
  const langVal=document.getElementById('f-lang-select').value;
  const lang=langVal==='other'?document.getElementById('f-lang-other').value.trim()||'其他':langVal;
  const book={
    id:currentEditId||Date.now(),
    title,
    category:document.getElementById('f-category').value.trim(),
    subcategory:document.getElementById('f-subcategory').value.trim(),
    series:document.getElementById('f-series-check').checked,
    seriesName:document.getElementById('f-series-name').value.trim(),
    seriesVol:document.getElementById('f-series-vol').value.trim(),
    author:document.getElementById('f-author').value.trim(),
    lang,
    translator:document.getElementById('f-translator').value.trim(),
    pubDate:document.getElementById('f-pub-date').value,
    publisher:document.getElementById('f-publisher').value.trim(),
    isbn:document.getElementById('f-isbn').value.trim(),
    edition:document.getElementById('f-edition').value.trim(),
    summary:document.getElementById('f-summary').value.trim(),
    buyDate:document.getElementById('f-buy-date').value,
    price:parseFloat(document.getElementById('f-price').value)||null,
    store:document.getElementById('f-store').value.trim(),
    readStatus:document.getElementById('f-read-status').value,
    readingPage:parseInt(document.getElementById('f-reading-page').value)||null,
    loaned:document.getElementById('f-loan-check').checked,
    loanPerson:document.getElementById('f-loan-person').value.trim(),
    loanDate:document.getElementById('f-loan-date').value,
    cover:currentCoverData,
    updatedAt:Date.now()
  };
  if(currentEditId){const i=db.findIndex(x=>x.id===currentEditId);if(i>-1)db[i]=book;}
  else{db.unshift(book);}
  save();closeModal('book-modal');renderBooks();toast(currentEditId?'書籍資料已更新':'已新增書籍');
}

function deleteCurrentBook(){
  if(!confirm('確定刪除此書籍？此操作無法復原。'))return;
  db=db.filter(x=>x.id!==currentEditId);
  save();closeModal('book-modal');renderBooks();toast('已刪除');
}

// ---- Render ----
function getFiltered(){
  const q=document.getElementById('search-input').value.toLowerCase();
  const fc=document.getElementById('f-cat').value;
  const fs=document.getElementById('f-subcat').value;
  const fl=document.getElementById('f-lang').value;
  const fst=document.getElementById('f-status').value;
  const fln=document.getElementById('f-loan').value;
  return db.filter(b=>{
    if(q&&![b.title,b.author,b.isbn,b.publisher,b.seriesName].some(v=>v&&v.toLowerCase().includes(q)))return false;
    if(fc&&b.category!==fc)return false;
    if(fs&&b.subcategory!==fs)return false;
    if(fl&&b.lang!==fl)return false;
    if(fst&&b.readStatus!==fst)return false;
    if(fln==='loaned'&&!b.loaned)return false;
    if(fln==='in'&&b.loaned)return false;
    return true;
  });
}

function setView(v){
  viewMode=v;
  document.getElementById('grid-view').style.display=v==='grid'?'grid':'none';
  document.getElementById('list-view').style.display=v==='list'?'block':'none';
  document.getElementById('view-grid').classList.toggle('active',v==='grid');
  document.getElementById('view-list').classList.toggle('active',v==='list');
}

function statusBadge(s){
  const map={unread:['尚未閱讀','status-unread'],reading:['閱讀中','status-reading'],done:['已閱畢','status-done']};
  const [label,cls]=map[s]||map.unread;
  return`<span class="status-badge ${cls}">${label}</span>`;
}
function statusDotColor(s){return{unread:'#9ca3af',reading:'#b07d2e',done:'#1f7a4a'}[s]||'#9ca3af'}

function renderBooks(){
  updateFilterOptions();
  const books=getFiltered();
  document.getElementById('book-count').textContent=`${books.length} 本`;
  renderStats(books);
  renderGrid(books);
  renderList(books);
}

function renderStats(books){
  const total=books.length;
  const unread=books.filter(b=>b.readStatus==='unread').length;
  const reading=books.filter(b=>b.readStatus==='reading').length;
  const done=books.filter(b=>b.readStatus==='done').length;
  const loaned=books.filter(b=>b.loaned).length;
  document.getElementById('statsbar').innerHTML=`
    <div class="stat-item"><div class="stat-dot" style="background:#6366f1"></div>全部 <strong>${total}</strong></div>
    <div class="stat-item"><div class="stat-dot" style="background:#9ca3af"></div>未讀 <strong>${unread}</strong></div>
    <div class="stat-item"><div class="stat-dot" style="background:#b07d2e"></div>閱讀中 <strong>${reading}</strong></div>
    <div class="stat-item"><div class="stat-dot" style="background:#1f7a4a"></div>已閱畢 <strong>${done}</strong></div>
    ${loaned?`<div class="stat-item"><div class="stat-dot" style="background:#f59e0b"></div>外借中 <strong>${loaned}</strong></div>`:''}
  `;
}

function renderGrid(books){
  const el=document.getElementById('grid-view');
  if(!books.length){el.innerHTML='<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-books"></i><p>書庫空空如也，點右上角「新增書籍」開始記錄！</p></div>';return}
  el.innerHTML=books.map(b=>{
    const [bg,fg]=spineColor(b.title);
    const coverHtml=b.cover
      ?`<img src="${b.cover}" class="book-cover-img" alt="">`
      :`<div class="book-cover-placeholder" style="background:${bg}"><i class="ti ti-book" style="font-size:22px;color:${fg};opacity:0.5"></i><div class="spine-title" style="color:${fg}">${b.title}</div><div class="spine-author" style="color:${fg}">${b.author||''}</div></div>`;
    return`<div class="book-card" onclick="showDetail(${b.id})">
      <div class="book-cover-wrap">
        ${coverHtml}
        <div class="book-status-dot" style="background:${statusDotColor(b.readStatus)}"></div>
        ${b.loaned?'<div class="book-loan-badge">借出</div>':''}
      </div>
      <div class="book-meta">
        <div class="book-title">${b.title}</div>
        <div class="book-author">${b.author||'—'}</div>
        ${b.category?`<div class="book-cat">${b.category}${b.subcategory?' · '+b.subcategory:''}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderList(books){
  if(!books.length){document.getElementById('list-tbody').innerHTML='<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--ink3)">無符合條件的書籍</td></tr>';return}
  document.getElementById('list-tbody').innerHTML=books.map(b=>{
    const [bg,fg]=spineColor(b.title);
    const thumb=b.cover?`<img src="${b.cover}" class="list-cover-thumb" alt="">`:`<div class="list-cover-ph" style="background:${bg}"><span style="color:${fg}">${(b.title||'?')[0]}</span></div>`;
    return`<tr onclick="showDetail(${b.id})">
      <td>${thumb}</td>
      <td><strong>${b.title}</strong>${b.series&&b.seriesName?`<br><span style="font-size:11px;color:var(--ink3)">${b.seriesName}${b.seriesVol?' '+b.seriesVol:''}</span>`:''}
      </td>
      <td>${b.author||'—'}</td>
      <td>${b.category||'—'}${b.subcategory?' / '+b.subcategory:''}</td>
      <td><span class="lang-tag">${b.lang||'—'}</span></td>
      <td>${statusBadge(b.readStatus)}</td>
      <td style="font-size:12px;color:var(--ink3)">${fmtDate(b.buyDate)}</td>
      <td>${b.loaned?`<span style="color:#b07d2e;font-size:12px;font-weight:600">借給 ${b.loanPerson||'?'}</span>`:'<span style="color:var(--ink3);font-size:12px">在架</span>'}</td>
    </tr>`;
  }).join('');
}

function showDetail(id){
  const b=db.find(x=>x.id===id);if(!b)return;
  const [bg,fg]=spineColor(b.title);
  const coverEl=b.cover
    ?`<img src="${b.cover}" class="detail-cover" alt="">`
    :`<div class="detail-cover-ph" style="background:${bg}"><i class="ti ti-book" style="font-size:36px;color:${fg};opacity:0.6"></i></div>`;

  const fields=[
    ['分類',b.category+(b.subcategory?' / '+b.subcategory:'')],
    ['語言',b.lang],
    b.translator?['譯者',b.translator]:null,
    b.series?['系列',b.seriesName+(b.seriesVol?' '+b.seriesVol:'')]:null,
    ['出版社',b.publisher],
    ['出版日期',fmtDate(b.pubDate)],
    ['ISBN',b.isbn],
    ['版次',b.edition],
    ['購買日期',fmtDate(b.buyDate)],
    b.price?['購買價格','NT$ '+b.price]:null,
    ['購買商店',b.store],
  ].filter(f=>f&&f[1]);

  const readStr=b.readStatus==='reading'&&b.readingPage?`閱讀中（第 ${b.readingPage} 頁）`:b.readStatus==='done'?'已閱畢':'尚未閱讀';

  document.getElementById('detail-content').innerHTML=`
    <div style="display:flex;gap:18px;margin-bottom:18px">
      ${coverEl}
      <div class="detail-info">
        <div class="detail-title">${b.title}</div>
        <div class="detail-author">${b.author||'作者不詳'}</div>
        <div class="detail-tags">
          ${statusBadge(b.readStatus)}
          <span class="lang-tag">${b.lang}</span>
          ${b.loaned?`<span class="status-badge" style="background:#fef3c7;color:#92400e">外借：${b.loanPerson||'?'}（${fmtDate(b.loanDate)}）</span>`:''}
        </div>
        <div class="detail-grid">
          ${fields.slice(0,6).map(f=>`<div class="detail-field"><div class="detail-field-label">${f[0]}</div><div class="detail-field-value">${f[1]||'—'}</div></div>`).join('')}
        </div>
      </div>
    </div>
    ${fields.length>6?`<div class="detail-grid">${fields.slice(6).map(f=>`<div class="detail-field"><div class="detail-field-label">${f[0]}</div><div class="detail-field-value">${f[1]||'—'}</div></div>`).join('')}</div>`:''}
    ${b.summary?`<div class="detail-summary">${b.summary.replace(/\n/g,'<br>')}</div>`:''}
  `;
  document.getElementById('detail-edit-btn').onclick=()=>{closeModal('detail-modal');openEditModal(id)};
  document.getElementById('detail-modal').classList.add('show');
}

// ---- Import / Export (Excel) ----
function exportData(){
  const wb = XLSX.utils.book_new();

  // Main book list sheet (no cover data — images stored separately)
  const rows = db.map(b=>({
    'ID': b.id,
    '書名': b.title||'',
    '分類': b.category||'',
    '子分類': b.subcategory||'',
    '系列作品': b.series?'是':'否',
    '系列名稱': b.seriesName||'',
    '集數/副標題': b.seriesVol||'',
    '作者': b.author||'',
    '語言': b.lang||'',
    '譯者': b.translator||'',
    '出版日期': b.pubDate||'',
    '出版社': b.publisher||'',
    'ISBN': b.isbn||'',
    '版次': b.edition||'',
    '摘要': b.summary||'',
    '購買日期': b.buyDate||'',
    '購買價格': b.price||'',
    '購買商店': b.store||'',
    '閱讀狀態': {'unread':'尚未閱讀','reading':'閱讀中','done':'已閱畢'}[b.readStatus]||'',
    '閱讀頁數': b.readingPage||'',
    '外借': b.loaned?'是':'否',
    '借書人': b.loanPerson||'',
    '借書日期': b.loanDate||'',
  }));

  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{}]);

  // Set column widths
  ws['!cols'] = [
    {wch:12},{wch:30},{wch:12},{wch:12},{wch:8},{wch:16},{wch:14},
    {wch:14},{wch:8},{wch:12},{wch:12},{wch:16},{wch:16},{wch:8},
    {wch:30},{wch:12},{wch:10},{wch:14},{wch:10},{wch:8},
    {wch:6},{wch:12},{wch:12}
  ];

  XLSX.utils.book_append_sheet(wb, ws, '書籍清單');

  // Note sheet about covers
  const noteWs = XLSX.utils.aoa_to_sheet([
    ['說明'],
    ['封面圖片因檔案大小限制，不包含在 Excel 匯出中。'],
    ['重新匯入後，封面需手動重新上傳。'],
    [''],
    ['統計'],
    ['總藏書數', db.length],
    ['尚未閱讀', db.filter(b=>b.readStatus==='unread').length],
    ['閱讀中', db.filter(b=>b.readStatus==='reading').length],
    ['已閱畢', db.filter(b=>b.readStatus==='done').length],
    ['外借中', db.filter(b=>b.loaned).length],
  ]);
  XLSX.utils.book_append_sheet(wb, noteWs, '統計說明');

  XLSX.writeFile(wb, '我的書庫_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('書單已匯出為 Excel');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets['書籍清單'];
      if(!ws)throw new Error('找不到「書籍清單」工作表');

      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      const statusMap={'尚未閱讀':'unread','閱讀中':'reading','已閱畢':'done'};

      const imported=rows.filter(r=>r['書名']).map(r=>({
        id: r['ID']||Date.now()+Math.random(),
        title: String(r['書名']||''),
        category: String(r['分類']||''),
        subcategory: String(r['子分類']||''),
        series: r['系列作品']==='是',
        seriesName: String(r['系列名稱']||''),
        seriesVol: String(r['集數/副標題']||''),
        author: String(r['作者']||''),
        lang: String(r['語言']||'繁體中文'),
        translator: String(r['譯者']||''),
        pubDate: String(r['出版日期']||''),
        publisher: String(r['出版社']||''),
        isbn: String(r['ISBN']||''),
        edition: String(r['版次']||''),
        summary: String(r['摘要']||''),
        buyDate: String(r['購買日期']||''),
        price: Number(r['購買價格'])||null,
        store: String(r['購買商店']||''),
        readStatus: statusMap[r['閱讀狀態']]||'unread',
        readingPage: Number(r['閱讀頁數'])||null,
        loaned: r['外借']==='是',
        loanPerson: String(r['借書人']||''),
        loanDate: String(r['借書日期']||''),
        cover: null, // covers not in Excel
        updatedAt: Date.now()
      }));

      if(!imported.length)throw new Error('工作表中沒有有效書籍資料');

      if(confirm(`讀取到 ${imported.length} 本書籍。\n匯入方式：與現有資料合併（相同 ID 會更新，新書會新增）。\n\n注意：封面圖片不包含在 Excel 中，匯入後需重新上傳。\n\n確定繼續？`)){
        const existing=new Map(db.map(b=>[b.id,b]));
        imported.forEach(b=>{
          // Preserve existing cover if same ID exists
          const old=existing.get(b.id);
          if(old&&old.cover)b.cover=old.cover;
          existing.set(b.id,b);
        });
        db=[...existing.values()];
        save();renderBooks();toast(`已匯入 ${imported.length} 本書籍`);
      }
    }catch(err){toast('匯入失敗：'+err.message);}
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
}

// ================================================================
// Google Drive Sync
// ================================================================
const CLIENT_ID = '587314368536-op4ge49m95mpro20hpl9jeg869j30m4h.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
const FILE_NAME = 'booklist_data.json';

let tokenClient = null;
let accessToken = null;
let driveFileId = null;
let syncTimer = null;
let pendingSync = false;
let gapiReady = false;
let gisReady = false;

// Init Google APIs
function initGoogleAPIs(){
  // Load gapi
  if(window.gapi){
    gapi.load('client', async ()=>{
      await gapi.client.init({});
      gapiReady = true;
      tryAutoSignIn();
    });
  } else {
    document.querySelector('script[src*="api.js"]').addEventListener('load',()=>{
      gapi.load('client', async ()=>{
        await gapi.client.init({});
        gapiReady = true;
        tryAutoSignIn();
      });
    });
  }

  // Init GIS token client
  const initGIS = ()=>{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: async (resp)=>{
        if(resp.error){setSyncStatus('error','授權失敗：'+resp.error);return;}
        accessToken = resp.access_token;
        localStorage.setItem('gdrive_token', accessToken);
        gapi.client.setToken({access_token: accessToken});
        setSyncStatus('syncing','正在讀取雲端資料…');
        await loadFromDrive();
      }
    });
    gisReady = true;
    tryAutoSignIn();
  };
  if(window.google?.accounts?.oauth2) initGIS();
  else document.querySelector('script[src*="gsi"]').addEventListener('load', initGIS);
}

function tryAutoSignIn(){
  if(!gapiReady || !gisReady) return;
  const saved = localStorage.getItem('gdrive_token');
  if(saved){
    accessToken = saved;
    gapi.client.setToken({access_token: accessToken});
    setSyncStatus('syncing','正在驗證連線…');
    loadFromDrive().catch(()=>{
      // Token expired
      accessToken = null;
      localStorage.removeItem('gdrive_token');
      setSyncStatus('disconnected','登入已過期，請重新連結 Google Drive');
    });
  }
}

function handleGoogleAuth(){
  if(accessToken){ signOut(); return; }
  if(!gisReady){ toast('Google 服務載入中，請稍後再試'); return; }
  tokenClient.requestAccessToken({prompt:''});
}

function signOut(){
  if(accessToken) google.accounts.oauth2.revoke(accessToken);
  accessToken = null;
  driveFileId = null;
  localStorage.removeItem('gdrive_token');
  setSyncStatus('disconnected','已登出，資料暫存於此裝置');
  document.getElementById('gdrive-btn-text').textContent='連結 Google Drive';
  document.getElementById('sync-now-btn').style.display='none';
  document.getElementById('signout-btn').style.display='none';
}

function setSyncStatus(state, msg){
  const dot = document.getElementById('sync-dot');
  const status = document.getElementById('sync-status');
  const bar = document.getElementById('syncbar');
  dot.className = 'sync-dot ' + state;
  status.textContent = msg;
  bar.className = state === 'syncing' ? 'syncing' : state === 'error' ? 'error' : '';
  if(state === 'connected'){
    document.getElementById('gdrive-btn-text').textContent = '已連結 Drive';
    document.getElementById('sync-now-btn').style.display = '';
    document.getElementById('signout-btn').style.display = '';
  }
}

// Find or create the data file in Drive appDataFolder
async function getDriveFileId(){
  if(driveFileId) return driveFileId;
  const resp = await gapi.client.request({
    path:'https://www.googleapis.com/drive/v3/files',
    params:{spaces:'appDataFolder', q:`name='${FILE_NAME}'`, fields:'files(id,name,modifiedTime)'}
  });
  const files = resp.result.files;
  if(files && files.length > 0){
    driveFileId = files[0].id;
  }
  return driveFileId;
}

async function loadFromDrive(){
  try{
    const fid = await getDriveFileId();
    if(!fid){
      // No file yet — first time. Save current local data to Drive.
      setSyncStatus('connected','已連結 Google Drive（首次使用，上傳本機資料中…）');
      await saveToDrive();
      setSyncStatus('connected','已連結 Google Drive ✓ — ' + new Date().toLocaleTimeString('zh-TW'));
      return;
    }
    const resp = await gapi.client.request({
      path:`https://www.googleapis.com/drive/v3/files/${fid}`,
      params:{alt:'media'}
    });
    const cloudDb = JSON.parse(resp.body);
    if(Array.isArray(cloudDb) && cloudDb.length > 0){
      // Merge: cloud wins, but preserve local covers not in cloud
      const localMap = new Map(db.map(b=>[b.id,b]));
      const merged = cloudDb.map(b=>({
        ...b,
        cover: b.cover || (localMap.get(b.id)||{}).cover || null
      }));
      db = merged;
      saveLocal();
      renderBooks();
    }
    setSyncStatus('connected','已連結 Google Drive ✓ — 上次同步：' + new Date().toLocaleTimeString('zh-TW'));
    toast('Google Drive 資料已載入');
  } catch(e){
    if(e.status === 401){
      accessToken = null;
      localStorage.removeItem('gdrive_token');
      setSyncStatus('error','登入已過期，請重新連結 Google Drive');
    } else {
      setSyncStatus('error','同步失敗：' + (e.result?.error?.message || e.message || '未知錯誤'));
    }
    throw e;
  }
}

async function saveToDrive(){
  if(!accessToken) return;
  const content = JSON.stringify(db);
  const boundary = 'booklist_boundary';
  const fid = await getDriveFileId();

  const metadata = JSON.stringify({name: FILE_NAME, parents: fid ? undefined : ['appDataFolder']});
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;

  const method = fid ? 'PATCH' : 'POST';
  const path = fid
    ? `https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=multipart`
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&spaces=appDataFolder';

  const resp = await fetch(path, {
    method,
    headers:{'Authorization':'Bearer '+accessToken,'Content-Type':`multipart/related; boundary=${boundary}`},
    body
  });
  if(!resp.ok){
    const err = await resp.json();
    throw new Error(err.error?.message || '上傳失敗');
  }
  const result = await resp.json();
  driveFileId = result.id;
}

async function syncNow(){
  if(!accessToken){toast('尚未連結 Google Drive');return;}
  setSyncStatus('syncing','同步中…');
  try{
    await saveToDrive();
    setSyncStatus('connected','已連結 Google Drive ✓ — 上次同步：'+new Date().toLocaleTimeString('zh-TW'));
    toast('已同步至 Google Drive');
  } catch(e){
    setSyncStatus('error','同步失敗：'+(e.message||'請重試'));
    toast('同步失敗，請重試');
  }
}

// Debounced auto-sync after every save
function scheduleSyncToDrive(){
  if(!accessToken) return;
  pendingSync = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    if(!pendingSync) return;
    pendingSync = false;
    setSyncStatus('syncing','自動同步中…');
    try{
      await saveToDrive();
      setSyncStatus('connected','已連結 Google Drive ✓ — 上次同步：'+new Date().toLocaleTimeString('zh-TW'));
    } catch(e){
      setSyncStatus('error','自動同步失敗，請手動同步');
    }
  }, 1500);
}

// ================================================================
// Local storage (fallback when not connected to Drive)
// ================================================================
function saveLocal(){localStorage.setItem('booklib_db',JSON.stringify(db));}
function loadLocal(){const s=localStorage.getItem('booklib_db');if(s)try{db=JSON.parse(s)}catch(e){}}

function load(){ loadLocal(); }
function save(){
  saveLocal();
  scheduleSyncToDrive();
}

// ---- Init ----
load();
setView('grid');
renderBooks();

// Init Google APIs after page loads
window.addEventListener('load', ()=>{ setTimeout(initGoogleAPIs, 500); });
</script>
